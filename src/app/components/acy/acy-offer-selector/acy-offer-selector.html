<div class="acy-offer">
        <div class="variant-options">
            <label class="acy-title" for="variants">CHOOSE YOUR FAVORITE FLAVORS</label>
            <div class="variant-row">
                <div class="variant-radio-wrapper">
                @for (f of flavors; track f.key) {
                    <div
                    class="variant-card"
                    [class.is-selected]="selectedFlavor() === f.key"
                    >
                    <label
                        class="variant-choice"
                        [for]="'variant-' + f.key"
                        (click)="setSelectedFlavor(f.key)"
                    >
                        <input
                        [id]="'variant-' + f.key"
                        type="radio"
                        name="variant-option"
                        [checked]="selectedFlavor() === f.key"
                        (change)="setSelectedFlavor(f.key)"
                        />

                        <div class="variant-image">
                        <img [src]="f.imgSrc" [alt]="f.imgAlt" />
                        </div>

                        <span class="variant-pill">{{ f.label }}</span>
                    </label>

                    <div class="variant-qty">
                        <select
                        class="variant-select"
                        [attr.aria-label]="f.label + ' quantity'"
                        [value]="quantities()[f.key]"
                        (change)="setQty(f.key, +(($any($event.target)).value))"
                        >
                        @for (n of optionsForFlavor(f.key); track n) {
                            <option [value]="n">{{ n }}</option>
                        }
                        </select>
                        <span class="variant-caret" aria-hidden="true"></span>
                    </div>
                    </div>
                }
                </div>
            </div>
        </div>
  <div class="acy-title">CHOOSE YOUR PACKAGE:</div>

  <div class="acy-pricing">
    <!-- SUBSCRIBE -->
    <button
      type="button"
      class="acy-pricing-card"
      [class.is-selected]="packageType() === 'sub'"
      (click)="setPackageType('sub')"
    >
      <div class="acy-card-top" [class.is-popular]="packageType() === 'sub'">
        MOST POPULAR
      </div>

      <div class="acy-card-body">
        <span class="acy-radio" aria-hidden="true"></span>

        <div class="acy-card-main-wrapper">
            <div class="acy-card-main">
                <div class="acy-card-heading">Subscribe & Save</div>
                <div class="acy-card-sub">
                    {{ oneTimeSubLabel() }}
                    @if (packageType() === 'sub' && totalQty() > 0) {
                        <span> (monthly)</span>
                    }
                </div>
            </div>
            <div class="acy-card-right">
                <div class="acy-price-row">
                    @if (showSubSavings()) {
                    <span class="acy-compare">Save {{ subSavingsPct() }}%</span>
                    }
                    <span class="acy-strong">{{ subUnitPriceLabel() }}</span>
                </div>
                <div class="acy-subprice">{{ subServingPriceLabel() }}</div>
            </div>
        </div>

      </div>

      <div class="acy-benefits-list">
        <ul class="acy-benefits">
            <li>Save 44-53% on every subscription order</li>
            <li>Easily change your quantities</li>
            <li>Cancel any time</li>
            <li>Pre-shipment reminders (no surprise charges)</li>
        </ul>
      </div>
    </button>

    <!-- ONE TIME -->
    <button
      type="button"
      class="acy-pricing-card"
      [class.is-selected]="packageType() === 'otp'"
      (click)="setPackageType('otp')"
    >
      <!-- keep header space so it aligns visually -->

      <div class="acy-card-body">
        <span class="acy-radio" aria-hidden="true"></span>

        <div class="acy-card-main-wrapper">
            <div class="acy-card-main">
          <div class="acy-card-heading">One-Time Purchase</div>
          <div class="acy-card-sub">{{ oneTimeSubLabel() }}</div>
        </div>

        <div class="acy-card-right">
            <div class="acy-price-row">
                @if (showOtpSavings()) {
                    <span class="acy-compare">Save {{ otpSavingsPct() }}%</span>
                }
                <span class="acy-strong">{{ oneTimeUnitPriceLabel() }}</span>
            </div>
            <div class="acy-subprice">{{ oneTimeServingPriceLabel() }}</div>
        </div>
        </div>

      </div>
    </button>

    @if (packageType() === 'otp') {
        <app-acy-logged-out-message-container
            [vipTotalPriceLabel]="vipTotalPriceLabel()"
        ></app-acy-logged-out-message-container>
    }

  </div>

    <button
        type="button"
        class="acy-cta"
        [disabled]="!canAddToCart()"
        [class.is-disabled]="!canAddToCart()"
        (click)="onAddToCart()"
        >
        {{ ctaLabel() }}
    </button>
</div>
