<div
  class="rhp-drawer-root"
  [class.is-open]="open"
  [attr.aria-hidden]="!open"
>
  <!-- Overlay (NO blur) -->
  <div class="rhp-drawer-overlay" (click)="onOverlayClick()"></div>

  <!-- Panel -->
  <div
    class="rhp-drawer-panel"
    role="dialog"
    aria-modal="true"
    aria-label="Cart"
    (click)="onPanelClick($event)"
  >
    <!-- Sticky header -->
    <div class="rhp-drawer-header">
      <div class="rhp-drawer-header__left">
        <div class="rhp-drawer-title">Cart</div>
        <div class="rhp-drawer-subtitle">Review your selection</div>
      </div>

      <button
        type="button"
        class="rhp-drawer-close"
        (click)="close.emit()"
        aria-label="Close"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M6.04289 16.5413C5.65237 16.9318 5.65237 17.565 6.04289 17.9555C6.43342 18.346 7.06658 18.346 7.45711 17.9555L11.9987 13.4139L16.5408 17.956C16.9313 18.3466 17.5645 18.3466 17.955 17.956C18.3455 17.5655 18.3455 16.9323 17.955 16.5418L13.4129 11.9997L17.955 7.4576C18.3455 7.06707 18.3455 6.43391 17.955 6.04338C17.5645 5.65286 16.9313 5.65286 16.5408 6.04338L11.9987 10.5855L7.45711 6.0439C7.06658 5.65338 6.43342 5.65338 6.04289 6.0439C5.65237 6.43442 5.65237 7.06759 6.04289 7.45811L10.5845 11.9997L6.04289 16.5413Z"
            fill="currentColor"
          />
        </svg>
      </button>
    </div>

    <!-- Scroll body -->
    <div class="rhp-drawer-body">
      @if (!item) {
        <p class="rhp-muted">Nothing in cart yet.</p>
      } @else {
        <div class="rhp-cart-card">
          <div class="rhp-cart-card__title">{{ item.productName }}</div>

          <div class="rhp-cart-meta">
            <div class="rhp-cart-row">
              <span class="rhp-cart-k">Flavor</span>
              <span class="rhp-cart-v">{{ item.flavorLabel }}</span>
            </div>

            <div class="rhp-cart-row">
              <span class="rhp-cart-k">Package</span>
              <span class="rhp-cart-v">{{ item.packageLabel }}</span>
            </div>

            <div class="rhp-cart-row">
              <span class="rhp-cart-k">For</span>
              <span class="rhp-cart-v">{{ item.peopleLabel }}</span>
            </div>

            <div class="rhp-cart-row rhp-cart-row--total">
              <span class="rhp-cart-k">Total</span>
              <span class="rhp-cart-v">${{ item.price.toFixed(2) }}</span>
            </div>
          </div>
        </div>

        @if (item.packageLabel === 'One-time purchase') {
          <app-rhp-logged-out-message-container
            [vipTotalPriceLabel]="item.vipTotalPriceLabel ?? ''"
            [loginHref]="item.loginHref ?? ''"
            [signUpHref]="item.signUpHref ?? ''"
          ></app-rhp-logged-out-message-container>
        }
      }
    </div>

    <!-- Sticky footer -->
    <div class="rhp-drawer-footer">
      <button type="button" class="rhp-drawer-secondary" (click)="close.emit()">
        Continue Shopping
      </button>

      <button type="button" class="rhp-drawer-primary">
        Checkout
      </button>
    </div>
  </div>
</div>
