<main class="min-h-screen bg-white px-4 sm:px-8 py-8">
  <a
    routerLink="/components"
    class="inline-flex items-center gap-2 text-sm font-semibold text-blue-700 hover:underline"
  >
    ← Back to components
  </a>

  <div class="mt-8">
    <h1 class="text-2xl font-semibold text-slate-900">Roundhouse Provisions PDP</h1>
    <p class="mt-2 text-sm text-slate-600">
      Product detail layout that mounts the RHP offer selector.
    </p>
  </div>

  <div class="mt-8">
    <app-rhp-product-detail (addToCart)="openDrawer($event)"></app-rhp-product-detail>
  </div>

  <app-rhp-cart-detail-drawer
    [open]="drawerOpen()"
    [item]="lastAddedItem()"
    (close)="closeDrawer()"
  ></app-rhp-cart-detail-drawer>
</main>
